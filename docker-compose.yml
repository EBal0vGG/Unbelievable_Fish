services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: fish
      POSTGRES_DB: fish
    ports:
      - "5433:5432"
    volumes:
      - fish_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fish -d fish"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    environment:
      MIGRATIONS_DIR: /migrations
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    build:
      context: .
      args:
        SERVICE: identity
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      IDENTITY_PORT: "8084"
      IDENTITY_TOKEN_SECRET: dev-secret
      IDENTITY_TOKEN_TTL_MINUTES: "120"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      CATALOG_PORT: "8081"
      IDENTITY_TOKEN_SECRET: dev-secret
      IDENTITY_TOKEN_TTL_MINUTES: "120"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started

  trading:
    build:
      context: .
      args:
        SERVICE: trading
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      TRADING_PORT: "8082"
      IDENTITY_TOKEN_SECRET: dev-secret
      IDENTITY_TOKEN_TTL_MINUTES: "120"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started

  deals:
    build:
      context: .
      args:
        SERVICE: deals
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      DEALS_PORT: "8083"
      IDENTITY_TOKEN_SECRET: dev-secret
      IDENTITY_TOKEN_TTL_MINUTES: "120"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started

  billing:
    build:
      context: .
      args:
        SERVICE: billing
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      BILLING_PORT: "8085"
      BILLING_ENABLE_FAKE_PROVIDER: "true"
      BILLING_ENABLE_ADMIN_ACTIONS: "true"
      # Async fake-provider callback hits the same webhook as production would (reachable from this container).
      BILLING_FAKE_PROVIDER_AUTO_CONFIRM: "true"
      BILLING_FAKE_WEBHOOK_BASE_URL: http://billing:8085/billing
      IDENTITY_TOKEN_SECRET: dev-secret
      IDENTITY_TOKEN_TTL_MINUTES: "120"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started

  integration:
    build:
      context: .
      args:
        SERVICE: integration
    environment:
      PGHOST: postgres
      PGUSER: fish
      PGPASSWORD: fish
      PGDATABASE: fish
      PGPORT: "5432"
      PGSSLMODE: disable
      AUCTION_CLOSE_INTERVAL_SEC: "5"
      AUCTION_CLOSE_BATCH: "100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_CATALOG_API_URL: http://catalog:8081
      NEXT_PUBLIC_TRADING_API_URL: http://trading:8082
      NEXT_PUBLIC_DEALS_API_URL: http://deals:8083
      NEXT_PUBLIC_IDENTITY_API_URL: http://identity:8084
      NEXT_PUBLIC_BILLING_URL: http://billing:8085/billing
      NEXT_PUBLIC_ENABLE_API_FALLBACK: "true"
      # Must match BILLING_ENABLE_FAKE_PROVIDER on billing so SSR/build sees opt-in; UI also follows GET /accounts/me when unset.
      NEXT_PUBLIC_ENABLE_FAKE_BILLING: "true"
      # Admin payout queue + billing operator UI (needs admin JWT + BILLING_ENABLE_ADMIN_ACTIONS above).
      NEXT_PUBLIC_ENABLE_BILLING_ADMIN: "true"
    ports:
      - "3000:3000"
    depends_on:
      identity:
        condition: service_started
      catalog:
        condition: service_started
      trading:
        condition: service_started
      deals:
        condition: service_started
      billing:
        condition: service_started

volumes:
  fish_pgdata:
